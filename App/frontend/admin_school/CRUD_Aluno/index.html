<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monetto – Alunos</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../../shared/main-style.css">
    <link rel="icon" type="image/x-icon" href="../../Assets/Monetto Logo.ico">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="sidebar-container"></div>

    <div class="main">
        <div class="page-grid">

            <!-- ===================== FORM ===================== -->
            <div class="form-area">
                <div class="form-title">👤 Cadastrar Aluno</div>
                <div class="form-sub">Preencha os dados do aluno e do responsável</div>

                <div class="fg">
                    <label for="nome">Nome do Aluno *</label>
                    <input id="nome" placeholder="Nome completo do aluno" autocomplete="name">
                </div>

                <div class="fg">
                    <label for="email">Email *</label>
                    <input id="email" type="email" placeholder="email@exemplo.com" autocomplete="email">
                </div>

                <div class="fg">
                    <label for="senha">Senha Provisoria*</label>
                    <input id="senha" type="password" placeholder="Senha do aluno" autocomplete="new-password">
                </div>

                <div class="fg">
                    <label for="data">Data de Nascimento *</label>
                    <input id="data" type="date">
                </div>

                <div class="fg">
                    <label for="cpf">CPF *</label>
                    <input id="cpf" placeholder="000.000.000-00" inputmode="numeric" maxlength="14">
                </div>

                <div class="fg">
                    <label for="resp">Responsável *</label>
                    <input id="resp" placeholder="Nome do responsável" autocomplete="name">
                </div>

                <div class="fg">
                    <label for="tel">Telefone *</label>
                    <input id="tel" placeholder="(00) 00000-0000" inputmode="tel" autocomplete="tel">
                </div>

                <div class="fg">
                    <label for="email">Email do Responsável *</label>
                    <input id="email" type="email" placeholder="email@exemplo.com" autocomplete="email">
                </div>

                <div class="fg">
                    <label for="serie">Série *</label>
                    <input id="serie" placeholder="Ex: 5º Ano, 1º Ano EM">
                </div>

                <div id="formMsg"></div>

                <div class="form-footer">
                    <button class="btn-acc" id="btn" type="button">Cadastrar Aluno</button>
                    <h4 class="succefull-text" id="successMsg">Aluno cadastrado com sucesso</h4>
                </div>
            </div>

            <!-- ===================== LIST + STATS ===================== -->
            <div class="right-col">
                <div class="stats-summary">
                    <div class="sc sc-b">
                        <div class="sc-icon">👥</div>
                        <div class="sc-val" id="alunos-matriculados-count">—</div>
                        <div class="sc-lbl">Alunos matriculados</div>
                        <div class="sc-sub" id="alunos-count">Dados do banco</div>
                    </div>
                </div>

                <div class="students-panel">
                    <div class="card-hd">
                        <h3>👨‍🎓 Alunos Ativos</h3>
                    </div>
                    <div id="students-list">
                        <div class="teach-item" style="opacity:.6">
                            <div class="tav ta1">⏳</div>
                            <div class="teach-info">
                                <strong>Carregando alunos…</strong>
                                <span>Aguarde</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>

        <p id="msg" hidden></p>
    </div>

    <script src="../../shared/monetto-app.js"></script>
    <script src="script.js"></script>
</body>

</html>
