<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Monetto – Administrador – Professores</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="admin-professores.css" />
  <link rel="icon" type="image/x-icon" href="../../Assets/Monetto Logo.ico">
</head>

<body>
  <div id="sidebar-container"></div>
  <main class="main">
    <div class="topbar">
      <h1>Gerenciar <span>Professores</span></h1>
      <div class="top-right">
        <div class="search-bar"><span>🔍</span><input type="text" placeholder="Buscar professor..."></div>
        <button class="btn btn-primary" onclick="document.getElementById('addModal').classList.add('open')">➕ Novo
          Professor</button>
      </div>
    </div>

    <div class="stats-row">
      <div class="sc sc-b">
        <div class="sc-icon">👨‍🏫</div>
        <div class="sc-val" id="stat-professores-ativos">—</div>
        <div class="sc-lbl">Professores ativos</div>
      </div>
      <div class="sc sc-g">
        <div class="sc-icon">🏫</div>
        <div class="sc-val" id="stat-turmas-gerenciadas">—</div>
        <div class="sc-lbl">Turmas gerenciadas</div>
      </div>
      <div class="sc sc-y">
        <div class="sc-icon">👥</div>
        <div class="sc-val" id="stat-alunos-atendidos">—</div>
        <div class="sc-lbl">Alunos atendidos</div>
      </div>
    </div>

    <div class="filter-tabs">
      <div class="ftab active" id="filter-todos">Todos</div>
    </div>

    <div class="card">
      <div class="table-head" style="grid-template-columns:2fr 90px 90px 90px 60px">
        <span>Professor</span><span>Turmas</span><span>Alunos</span><span>Status</span><span>Ações</span>
      </div>
      <div id="professoresContainer"></div>
    </div>
  </main>

  <div class="modal-overlay" id="addModal" onclick="if(event.target===this)this.classList.remove('open')">
    <div class="modal">
      <div class="modal-title">👨‍🏫 Novo Professor</div>
      <div class="modal-sub">Preencha os dados para cadastrar um professor</div>
      <div class="form-row">
        <div class="field-group"><label>Nome</label><input type="text" placeholder="Nome"></div>
        <div class="field-group"><label>Sobrenome</label><input type="text" placeholder="Sobrenome"></div>
      </div>
      <div class="field-group"><label>E-mail</label><input type="email" placeholder="email@escola.edu"></div>
      <div class="form-row">
        <div class="field-group"><label>Matéria</label><select>
            <option>Matemática</option>
            <option>Português</option>
            <option>Ciências</option>
            <option>História</option>
            <option>Geografia</option>
          </select></div>
        <div class="field-group"><label>Status</label><select>
            <option>Ativo</option>
            <option>Inativo</option>
          </select></div>
      </div>
      <div class="modal-btns">
        <button class="btn-modal-cancel"
          onclick="document.getElementById('addModal').classList.remove('open')">Cancelar</button>
        <button class="btn-modal-ok">✅ Cadastrar Professor</button>
      </div>
    </div>
  </div>


  <script>

    function salvarNovoItem() {
      document.getElementById('addModal').classList.remove('open');
      document.getElementById('addModal').style.display = 'none';
      MonettoUI.toast('Professor cadastrado com sucesso! ✅', 'success');
    }
    function showToast(msg, tipo) {
      if (typeof MonettoUI !== 'undefined') {
        MonettoUI.toast(msg || 'Ação realizada!', tipo || 'success');
      }
    }

    // Reads the logged-in user saved at login time (see main.js's 'login'
    // handler). We only ever send this user's id to the backend; the
    // backend re-derives id_escola from it server-side, so this list can
    // never include another school's teachers.
    function getCurrentUserId() {
      try {
        const session = JSON.parse(localStorage.getItem('session') || '{}');
        return session.id_usuario || session.id || null;
      } catch (e) {
        return null;
      }
    }

    const AVATAR_COLORS = ['av1', 'av2', 'av3', 'av4', 'av5'];

    function renderProfessores(professores) {
      const container = document.getElementById('professoresContainer');

      if (!professores.length) {
        container.innerHTML = '<div style="padding:2rem;text-align:center;color:#888">Nenhum professor cadastrado.</div>';
        return;
      }

      container.innerHTML = professores.map((p, i) => {
        const inicial = (p.nome || '?')[0].toUpperCase();
        const colorClass = AVATAR_COLORS[i % AVATAR_COLORS.length];
        const statusLabel = p.ativo ? 'Ativo' : 'Inativo';
        const badgeClass = p.ativo ? 'badge-green' : 'badge-red';

        return `
          <div class="data-row" style="grid-template-columns:2fr 90px 90px 90px 60px">
            <div class="person-info">
              <div class="av ${colorClass}">${inicial}</div>
              <div>
                <div class="person-name">${p.nome}</div>
                <div class="person-sub">${p.email}</div>
              </div>
            </div>
            <div style="font-size:.85rem;font-weight:600">${p.turmas_count ?? 0}</div>
            <div style="font-size:.85rem;font-weight:600">${p.alunos_count ?? 0}</div>
            <div><span class="badge ${badgeClass}">${statusLabel}</span></div>
            <div class="act-btns">
              <div class="act-btn">👁</div>
              <div class="act-btn">✏️</div>
            </div>
          </div>`;
      }).join('');
    }

    async function loadProfessores() {
      const container = document.getElementById('professoresContainer');
      container.innerHTML = '<div style="padding:2rem;text-align:center;color:#888">Carregando...</div>';

      const currentUserId = getCurrentUserId();
      if (!currentUserId) {
        container.innerHTML = '<div style="padding:2rem;text-align:center;color:red">Sessão inválida — faça login novamente.</div>';
        return;
      }

      const result = await window.api.getProfessores(currentUserId);

      if (!result.success) {
        container.innerHTML = `<div style="padding:2rem;text-align:center;color:red">${result.message}</div>`;
        return;
      }

      const professores = result.data;
      const ativos = professores.filter(p => p.ativo).length;
      const turmasTotal = professores.reduce((sum, p) => sum + (Number(p.turmas_count) || 0), 0);
      const alunosTotal = professores.reduce((sum, p) => sum + (Number(p.alunos_count) || 0), 0);

      document.getElementById('stat-professores-ativos').textContent = ativos;
      document.getElementById('stat-turmas-gerenciadas').textContent = turmasTotal;
      document.getElementById('stat-alunos-atendidos').textContent = alunosTotal;
      document.getElementById('filter-todos').textContent = `Todos (${professores.length})`;

      renderProfessores(professores);
    }

    document.addEventListener('DOMContentLoaded', loadProfessores);
  </script>
  <script src="../../shared/monetto-app.js"></script>
</body>

</html>
