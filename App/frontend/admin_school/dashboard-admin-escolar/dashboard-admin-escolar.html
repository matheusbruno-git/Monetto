<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Monetto – Dashboard Admin Escolar</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="dashboard-admin-escolar.css"/>
</head>
<body>

<div id="sidebar-container"></div>

<main class="main">

  <!-- SCHOOL HERO (preenchido dinamicamente) -->
  <div class="school-hero">
    <div class="sh-left">
      <div class="sh-icon">🏫</div>
      <div class="sh-info">
        <h2 id="school-name"></h2>
        <p>Dashboard do Administrador Escolar · Abril 2026</p>
        <div class="sh-chips">
          <span class="shc">📅 Ano letivo 2026</span>
          <span class="shc">🔒 Admin</span>
          <span class="shc" style="color:var(--green)">● Sistema ativo</span>
        </div>
      </div>
    </div>
    <div class="sh-stats"></div>
  </div>

  <!-- STATS (preenchido dinamicamente) -->
  <div class="stats-row"></div>

  <!-- ROW 1 -->
  <div class="g2">
    <div class="card" id="teachers-card">
      <div class="card-hd"><h3>👨‍🏫 Professores Ativos</h3><a href="../gerenciar-professores/gerenciar-professores.html">Gerenciar →</a></div>
    </div>

    <div class="card" id="alerts-card">
      <div class="card-hd"><h3>⚠️ Alertas da Escola</h3><a>Ver todos</a></div>
    </div>
  </div>

  <!-- ROW 2 -->
  <div class="g3">
    <div class="card" id="classes-card">
      <div class="card-hd"><h3>📚 Turmas por Engajamento</h3></div>
    </div>

    <div class="card" id="xp-card">
      <div class="card-hd"><h3>📈 XP por Semana</h3></div>
    </div>

    <div class="card" id="activities-card">
      <div class="card-hd"><h3>⚡ Atividades Recentes</h3></div>
    </div>
  </div>
</main>

<script id="logout-script">
function sairDaConta(destino) {
  if (confirm("Tem certeza que deseja sair da conta?")) {
    window.location.href = destino;
  }
}
</script>

<script>
(async function () {

  function escapeHtml(value) {
    return String(value ?? '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function renderHero(data) {
    const heroInfo = document.querySelector('.school-hero .sh-info');
    if (heroInfo) {
      const title = heroInfo.querySelector('h2');
      const subtitle = heroInfo.querySelector('p');
      if (title) title.innerHTML = escapeHtml(data.school?.name || 'Escola');
      if (subtitle) subtitle.innerHTML = escapeHtml(data.school?.subtitle || 'Dashboard do Administrador Escolar');
      const chips = heroInfo.querySelector('.sh-chips');
      if (chips) {
        chips.innerHTML = (data.school?.chips || []).map((chip) => `<span class="shc">${escapeHtml(chip)}</span>`).join('');
      }
    }

    const shStats = document.querySelector('.school-hero .sh-stats');
    if (shStats) {
      shStats.innerHTML = (data.school?.stats || []).map((item) => `
        <div class="shs-item">
          <div class="shs-val">${escapeHtml(item.value)}</div>
          <div class="shs-lbl">${escapeHtml(item.label)}</div>
        </div>
      `).join('');
    }
  }

  function renderStats(data) {
    const container = document.querySelector('.stats-row');
    if (!container) return;
    container.innerHTML = (data.stats || []).map((item) => `
      <div class="sc ${escapeHtml(item.className || '')}">
        <div class="sc-icon">${escapeHtml(item.icon || '')}</div>
        <div class="sc-val">${escapeHtml(item.value)}</div>
        <div class="sc-lbl">${escapeHtml(item.label)}</div>
        <div class="sc-sub">${escapeHtml(item.sub)}</div>
      </div>
    `).join('');
  }

  function renderTeachers(data) {
    const card = document.getElementById('teachers-card');
    if (!card) return;
    card.innerHTML = `
      <div class="card-hd"><h3>👨‍🏫 Professores Ativos</h3><a href="../gerenciar-professores/gerenciar-professores.html">Gerenciar →</a></div>
      ${(data.teachers || []).map((teacher) => `
        <div class="teach-item">
          <div class="tav ${escapeHtml(teacher.avatarClass || 'ta1')}">${escapeHtml(teacher.avatar || '👨‍🏫')}</div>
          <div class="teach-info">
            <strong>${escapeHtml(teacher.name)}</strong>
            <span>${escapeHtml(teacher.details)}</span>
          </div>
          <div class="teach-right">
            <div class="eng-val">${escapeHtml(teacher.engagement)}%</div>
            <div class="eng-lbl">engajamento</div>
            <div class="mini-prog"><div class="mini-f" style="width:${escapeHtml(teacher.engagement)}%"></div></div>
          </div>
        </div>
      `).join('')}
    `;
  }

  function renderAlerts(data) {
    const card = document.getElementById('alerts-card');
    if (!card) return;
    card.innerHTML = `
      <div class="card-hd"><h3>⚠️ Alertas da Escola</h3><a>Ver todos</a></div>
      ${(data.alerts || []).map((alert) => `
        <div class="alert-item ${escapeHtml(alert.className || 'al-blue')}">
          <div class="alert-icon">${escapeHtml(alert.icon || '🔵')}</div>
          <div class="alert-body">
            <strong>${escapeHtml(alert.title)}</strong>
            <span>${escapeHtml(alert.subtitle)}</span>
          </div>
          <button class="alert-action">${escapeHtml(alert.actionLabel || 'Ver')}</button>
        </div>
      `).join('')}
    `;
  }

  function renderClasses(data) {
    const card = document.getElementById('classes-card');
    if (!card) return;
    const rows = (data.classes || []).map((item) => {
      const statusClass = item.status === 'Atenção' ? 'sd-r' : item.status === 'Bom' ? 'sd-y' : 'sd-g';
      const statusColor = item.status === 'Atenção' ? 'var(--red)' : item.status === 'Bom' ? 'var(--accent)' : 'var(--green)';
      return `
        <div class="turma-row">
          <div style="font-size:.85rem;font-weight:600">${escapeHtml(item.name)}</div>
          <div style="color:var(--muted);font-size:.82rem">${escapeHtml(item.students)}</div>
          <div>
            <div class="pbar-wrap">
              <div class="pbar"><div class="pbar-f" style="width:${escapeHtml(item.completion)}%"></div></div>
              <span style="font-size:.72rem;color:${statusColor}">${escapeHtml(item.completion)}%</span>
            </div>
          </div>
          <div>
            <span class="status-dot ${statusClass}"></span>
            <span style="font-size:.72rem;color:${statusColor}">${escapeHtml(item.status)}</span>
          </div>
        </div>
      `;
    }).join('');

    card.innerHTML = `
      <div class="card-hd"><h3>📚 Turmas por Engajamento</h3></div>
      <div class="turma-row th"><div>Turma</div><div>Alunos</div><div>Conclusão</div><div>Status</div></div>
      ${rows}
    `;
  }

  function renderXp(data) {
    const card = document.getElementById('xp-card');
    if (!card) return;
    const bars = (data.xpChart || []).map((item) => `
      <div class="bc">
        <div class="bc-bar ${escapeHtml(item.color || 'blue')}" style="height:${escapeHtml(item.height)}px"></div>
        <div class="bc-lbl">${escapeHtml(item.label)}</div>
      </div>
    `).join('');
    card.innerHTML = `
      <div class="card-hd"><h3>📈 XP por Semana</h3></div>
      <div class="bar-chart">${bars}</div>
      <div style="text-align:center;font-size:.72rem;color:var(--muted);margin-top:8px">${escapeHtml(data.xpChartSummary || 'XP total distribuído por semana')}</div>
      <div style="display:flex;justify-content:space-around;margin-top:12px">
        <div style="text-align:center"><div style="font-family:'Syne',sans-serif;font-size:1.1rem;font-weight:800;color:var(--accent)">${escapeHtml(data.xpMonthValue || '0k')}</div><div style="font-size:.68rem;color:var(--muted)">XP este mês</div></div>
        <div style="text-align:center"><div style="font-family:'Syne',sans-serif;font-size:1.1rem;font-weight:800;color:var(--green)">${escapeHtml(data.xpMonthDelta || '—')}</div><div style="font-size:.68rem;color:var(--muted)">vs. mês anterior</div></div>
      </div>
    `;
  }

  function renderActivities(data) {
    const card = document.getElementById('activities-card');
    if (!card) return;
    card.innerHTML = `
      <div class="card-hd"><h3>⚡ Atividades Recentes</h3></div>
      ${(data.activities || []).map((activity) => `
        <div class="act-item">
          <div class="act-icon ${escapeHtml(activity.iconClass || 'ai-g')}">${escapeHtml(activity.icon || '✅')}</div>
          <div class="act-body">
            <strong>${escapeHtml(activity.title)}</strong>
            <span>${escapeHtml(activity.subtitle)}</span>
          </div>
          <div class="act-time">${escapeHtml(activity.time)}</div>
        </div>
      `).join('')}
    `;
  }

  async function loadDashboardData() {
    try {
      // Electron IPC via preload.js → main.js → MySQL
      if (!window.api || typeof window.api.getDashboardAdminEscolar !== 'function') {
        throw new Error('window.api.getDashboardAdminEscolar não está disponível. Verifique o preload.js');
      }

      const result = await window.api.getDashboardAdminEscolar();
      if (!result.success) {
        throw new Error(result.message || 'Falha ao carregar dados');
      }

      const data = result.data;
      renderHero(data);
      renderStats(data);
      renderTeachers(data);
      renderAlerts(data);
      renderClasses(data);
      renderXp(data);
      renderActivities(data);
    } catch (error) {
      console.warn('Não foi possível carregar os dados do backend:', error);
    }
  }

  loadDashboardData();
})();
</script>
<script src="script.js"></script>
</body>
</html>
