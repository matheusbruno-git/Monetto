<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Professor | Monetto</title>
    <link rel="stylesheet" href="../../shared/main-style.css">
    <link rel="icon" type="image/x-icon" href="../../Assets/Monetto Logo.ico">

  <link rel="stylesheet" href="../../shared/redesign.css" />
</head>

<body>
<header class="app-header">
  <button class="app-icon-btn" id="appMenuBtn" type="button" aria-label="Abrir menu" aria-expanded="false"><span class="menu-lines" aria-hidden="true"></span></button>
  <a class="app-brand" href="../../user/monetto-landing/monetto-landing.html" aria-label="Monetto, página inicial"><span class="app-brand-mark" aria-hidden="true">M</span><span>Monetto</span><span class="app-brand-subtitle">Educação financeira</span></a>
  <span class="app-spacer"></span>
  <button class="app-icon-btn" id="appThemeBtn" type="button" aria-label="Alternar tema" title="Alternar tema"><span class="theme-mark" aria-hidden="true"></span></button>
</header>
    <div id="sidebar-container"></div>
    <main class="main">
      <div class="topbar">
        <div>
          <h1>Cadastrar professor</h1>
          <p>Preencha as informações do novo professor.</p>
        </div>
      </div>
      <section class="card tool" aria-labelledby="teacher-form-title">
        <h2 id="teacher-form-title" class="page-title">Dados do professor</h2>
        <div class="tool-grid">
          <div class="field"><label for="nome">Nome do professor</label><input id="nome" placeholder="Nome do professor" autocomplete="given-name"></div>
          <div class="field"><label for="data">Data de nascimento</label><input id="data" type="date"></div>
          <div class="field"><label for="cpf">CPF</label><input id="cpf" placeholder="CPF" inputmode="numeric"></div>
          <div class="field"><label for="tel">Telefone</label><input id="tel" placeholder="Telefone" type="tel" autocomplete="tel"></div>
          <div class="field"><label for="email">E-mail</label><input id="email" placeholder="E-mail" type="email" autocomplete="email"></div>
          <div class="field"><label for="serie">Série</label><input id="serie" placeholder="Série"></div>
        </div>
        <div class="row end"><button id="btn" class="btn-primary" type="button">Cadastrar professor</button></div>
        <p id="msg" role="status" aria-live="polite"></p>
      </section>
    </main>

    <script src="script.js"></script>
    <script src="../../shared/monetto-app.js"></script>
  <script src="../../shared/monetto-shell.js"></script>
</body>

</html>
