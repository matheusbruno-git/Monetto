<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Monetto – Administrador – Configurações</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="../../shared/main-style.css" />
  <link rel="icon" type="image/x-icon" href="../../Assets/Monetto Logo.ico">
</head>

<body>
  <div id="sidebar-container"></div>
  <main class="main">
    <div class="topbar">
      <h1>Configurações <span>Admin</span></h1>
      <div class="top-right">
        <button class="btn btn-primary" id="save-btn">💾 Salvar</button>
      </div>
    </div>

    <div style="display:grid;grid-template-columns:200px 1fr;gap:0;height:calc(100vh - 130px);overflow:hidden">
      <div style="border-right:1px solid var(--border);padding:20px 0;overflow-y:auto">
        <div
          style="font-size:.65rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:0 16px;margin-bottom:8px">
          Seções</div>
        <div
          style="display:flex;align-items:center;gap:8px;padding:10px 16px;cursor:pointer;font-size:.85rem;font-weight:600;color:var(--white);background:rgba(255,215,0,.07);border-left:3px solid var(--accent)">
          👤 Meu Perfil</div>
        <div
          style="display:flex;align-items:center;gap:8px;padding:10px 16px;cursor:pointer;font-size:.85rem;font-weight:500;color:var(--muted);border-left:3px solid transparent">
          🔔 Notificações</div>
        <div
          style="display:flex;align-items:center;gap:8px;padding:10px 16px;cursor:pointer;font-size:.85rem;font-weight:500;color:var(--muted);border-left:3px solid transparent">
          🛡️ Segurança</div>
        <div
          style="display:flex;align-items:center;gap:8px;padding:10px 16px;cursor:pointer;font-size:.85rem;font-weight:500;color:var(--muted);border-left:3px solid transparent">
          🎨 Aparência</div>
      </div>
      <div style="padding:28px 32px;overflow-y:auto">
        <div style="margin-bottom:24px">
          <h2 style="font-family:'Syne',sans-serif;font-size:1.1rem;font-weight:800;margin-bottom:4px">👤 Perfil do
            Administrador</h2>
          <p style="font-size:.82rem;color:var(--muted)">Gerencie suas informações de acesso</p>
        </div>

        <div
          style="background:linear-gradient(135deg,#111a5c,#1a2a8f);border:1px solid var(--border);border-radius:20px;padding:22px;display:flex;align-items:center;gap:20px;margin-bottom:22px;position:relative;overflow:hidden">
          <div
            style="position:absolute;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(255,215,0,.07),transparent 70%);top:-60px;right:-30px">
          </div>
          <div
            style="width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,#c0392b,#8b0000);display:flex;align-items:center;justify-content:center;font-size:1.8rem">
            🛡️</div>
          <div>
            <div id="perfil-nome"
              style="font-family:'Syne',sans-serif;font-size:1rem;font-weight:800;margin-bottom:4px">Carregando…
            </div>
            <div id="perfil-email-escola" style="font-size:.8rem;color:var(--muted);margin-bottom:8px">—</div>
            <span class="badge badge-red">Administrador</span>
          </div>
        </div>

        <div class="card">
          <div class="card-hd">
            <h3>✏️ Informações Pessoais</h3>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
            <div class="field-group"><label>Nome</label><input type="text" id="campo-nome" value=""
                style="background:rgba(255,255,255,.07);border:1.5px solid var(--border);border-radius:12px;padding:11px 14px;color:var(--white);font-size:.88rem;font-family:'DM Sans',sans-serif;outline:none" />
            </div>
            <div class="field-group"><label>E-mail</label><input type="email" id="campo-email" value=""
                style="background:rgba(255,255,255,.07);border:1.5px solid var(--border);border-radius:12px;padding:11px 14px;color:var(--white);font-size:.88rem;font-family:'DM Sans',sans-serif;outline:none" />
            </div>
          </div>
        </div>

        <div class="card">
          <div class="card-hd">
            <h3>🔑 Alterar Senha</h3>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px">
            <div class="field-group"><label>Senha atual</label><input type="password" placeholder="••••••••"
                style="background:rgba(255,255,255,.07);border:1.5px solid var(--border);border-radius:12px;padding:11px 14px;color:var(--white);font-size:.88rem;font-family:'DM Sans',sans-serif;outline:none" />
            </div>
            <div class="field-group"><label>Nova senha</label><input type="password" placeholder="••••••••"
                style="background:rgba(255,255,255,.07);border:1.5px solid var(--border);border-radius:12px;padding:11px 14px;color:var(--white);font-size:.88rem;font-family:'DM Sans',sans-serif;outline:none" />
            </div>
            <div class="field-group"><label>Confirmar senha</label><input type="password" placeholder="••••••••"
                style="background:rgba(255,255,255,.07);border:1.5px solid var(--border);border-radius:12px;padding:11px 14px;color:var(--white);font-size:.88rem;font-family:'DM Sans',sans-serif;outline:none" />
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>


  <script>
    function showToast(msg, tipo) {
      if (typeof MonettoUI !== 'undefined') {
        MonettoUI.toast(msg || 'Ação realizada!', tipo || 'success');
      }
    }

    // Shows the actual logged-in admin (from the session set at login),
    // not a hardcoded placeholder. The school name comes from the
    // school-scoped dashboard query, so it always matches this admin's
    // own id_escola.
    async function loadPerfil() {
      const session = JSON.parse(localStorage.getItem('session') || '{}');
      const currentUserId = session.id_usuario || session.id;
      if (!currentUserId) return;

      document.getElementById('perfil-nome').textContent = session.nome || '—';
      document.getElementById('campo-nome').value = session.nome || '';
      document.getElementById('campo-email').value = session.email || '';

      let escolaNome = '';
      if (window.api?.getDashboardAdminEscolar) {
        const result = await window.api.getDashboardAdminEscolar(currentUserId);
        if (result.success) escolaNome = result.data.school.name;
      }
      document.getElementById('perfil-email-escola').textContent =
        [session.email, escolaNome].filter(Boolean).join(' · ');
    }

    async function salvarPerfil() {
      const session = JSON.parse(localStorage.getItem('session') || '{}');
      const currentUserId = session.id_usuario || session.id;
      if (!currentUserId) return;

      const nome = document.getElementById('campo-nome').value.trim();
      const email = document.getElementById('campo-email').value.trim();

      try {
        const result = await window.api.updateAdmin({ id_usuario: currentUserId, nome, email });
        if (result.success) {
          showToast('Perfil atualizado com sucesso!', 'success');
          // Update the session in localStorage with the new name/email
          session.nome = nome;
          session.email = email;
          localStorage.setItem('session', JSON.stringify(session));
          loadPerfil(); // Refresh displayed profile info
        } else {
          showToast(result.message || 'Falha ao atualizar perfil.', 'error');
          alert(result.message || 'Falha ao atualizar perfil.');
        }
      } catch (err) {
        console.error(err);
        showToast('Erro de comunicação com o servidor.', 'error');
      }
    }

    document.addEventListener('DOMContentLoaded', loadPerfil);
    document.getElementById('save-btn').addEventListener('click', salvarPerfil);
  </script>
  <script src="../../shared/monetto-app.js"></script>
</body>

</html>
