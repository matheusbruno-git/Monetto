<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Monetto – Administrador – Relatórios</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="admin-relatorios.css" />
  <link rel="icon" type="image/x-icon" href="../../Assets/Monetto Logo.ico">
</head>

<body>
  <div id="sidebar-container"></div>
  <main class="main">
    <div class="topbar">
      <h1>Relatórios <span>da Escola</span></h1>
      <div class="top-right">
        <button class="btn btn-outline">📥 Exportar PDF</button>
        <button class="btn btn-primary">📊 Gerar Relatório</button>
      </div>
    </div>

    <div class="filter-tabs">
      <div class="ftab active">Abril 2026</div>
      <div class="ftab">Março</div>
      <div class="ftab">1º Bimestre</div>
      <div class="ftab">Ano letivo</div>
    </div>

    <div class="stats-row">
      <div class="sc sc-g">
        <div class="sc-icon">✅</div>
        <div class="sc-val" id="rel-taxa-conclusao">—</div>
        <div class="sc-lbl">Taxa de conclusão</div>
      </div>
      <div class="sc sc-y">
        <div class="sc-icon">⚡</div>
        <div class="sc-val" id="rel-xp">—</div>
        <div class="sc-lbl">XP distribuído</div>
      </div>
      <div class="sc sc-b">
        <div class="sc-icon">📋</div>
        <div class="sc-val" id="rel-tarefas">—</div>
        <div class="sc-lbl">Tarefas publicadas</div>
      </div>
      <div class="sc sc-r">
        <div class="sc-icon">👥</div>
        <div class="sc-val" id="rel-alunos">—</div>
        <div class="sc-lbl">Alunos ativos</div>
      </div>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:18px">
      <div class="card">
        <div class="card-hd">
          <h3>📈 XP por Semana</h3>
        </div>
        <div id="rel-xp-chart" style="display:flex;align-items:flex-end;gap:10px;height:100px;padding-top:8px"></div>
      </div>
      <div class="card">
        <div class="card-hd">
          <h3>📚 Conclusão por Turma</h3>
        </div>
        <div id="rel-turmas-conclusao" style="display:flex;flex-direction:column;gap:10px"></div>
      </div>
    </div>

    <div class="card">
      <div class="card-hd">
        <h3>👨‍🏫 Professores da Escola</h3>
      </div>
      <div class="table-head" style="grid-template-columns:1.5fr 100px 100px">
        <span>Professor</span><span>Turmas</span><span>Alunos</span>
      </div>
      <div id="rel-professores"></div>
    </div>
  </main>


  <script>
    function showToast(msg, tipo) {
      if (typeof MonettoUI !== 'undefined') {
        MonettoUI.toast(msg || 'Ação realizada!', tipo || 'success');
      }
    }

    // Reads the logged-in user saved at login time (see main.js's 'login'
    // handler). We only ever send this user's id to the backend; the
    // backend re-derives id_escola from it server-side, so every number
    // and row on this page belongs to this admin's own school.
    function getCurrentUserId() {
      try {
        const session = JSON.parse(localStorage.getItem('session') || '{}');
        return session.id_usuario || session.id || null;
      } catch (e) {
        return null;
      }
    }

    function renderXpChart(xpChart) {
      const el = document.getElementById('rel-xp-chart');
      if (!xpChart || !xpChart.length) {
        el.innerHTML = '<div style="color:var(--muted);font-size:.8rem">Sem dados de XP ainda.</div>';
        return;
      }
      const max = Math.max(...xpChart.map(b => b.height), 1);
      el.innerHTML = xpChart.map(b => `
        <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px">
          <div style="width:100%;border-radius:4px 4px 0 0;height:${Math.max(4, (b.height / max) * 90)}px;background:linear-gradient(180deg,#5B9BF8,rgba(91,155,248,.25))"></div>
          <div style="font-size:.62rem;color:var(--muted)">${b.label}</div>
        </div>`).join('');
    }

    function renderTurmasConclusao(classes) {
      const el = document.getElementById('rel-turmas-conclusao');
      if (!classes || !classes.length) {
        el.innerHTML = '<div style="color:var(--muted);font-size:.8rem">Nenhuma turma cadastrada.</div>';
        return;
      }
      el.innerHTML = classes.map(c => `
        <div style="display:flex;align-items:center;gap:10px;font-size:.82rem">
          <span style="width:60px">${c.name}</span>
          <div style="flex:1;height:6px;background:rgba(255,255,255,.1);border-radius:99px;overflow:hidden">
            <div style="height:100%;width:${c.completion}%;border-radius:99px;background:linear-gradient(90deg,var(--green),var(--accent))"></div>
          </div>
          <span style="width:32px;text-align:right;color:var(--green);font-weight:700">${c.completion}%</span>
        </div>`).join('');
    }

    function renderProfessores(professores) {
      const el = document.getElementById('rel-professores');
      if (!professores.length) {
        el.innerHTML = '<div style="padding:1.5rem;text-align:center;color:#888">Nenhum professor cadastrado.</div>';
        return;
      }
      el.innerHTML = professores.map((p, i) => `
        <div class="data-row" style="grid-template-columns:1.5fr 100px 100px">
          <div class="person-info">
            <div class="av av${(i % 5) + 1}">${(p.nome || '?')[0].toUpperCase()}</div>
            <div><div class="person-name">${p.nome}</div></div>
          </div>
          <div style="font-size:.85rem;font-weight:600">${p.turmas_count ?? 0}</div>
          <div style="font-size:.85rem;font-weight:600">${p.alunos_count ?? 0}</div>
        </div>`).join('');
    }

    async function loadRelatorios() {
      const currentUserId = getCurrentUserId();
      if (!currentUserId) return;

      const [dashResult, profResult] = await Promise.all([
        window.api.getDashboardAdminEscolar(currentUserId),
        window.api.getProfessores(currentUserId)
      ]);

      if (dashResult.success) {
        const d = dashResult.data;
        const [statAlunos, statTaxa, statTarefas, statXp] = d.stats || [];
        if (statTaxa) document.getElementById('rel-taxa-conclusao').textContent = statTaxa.value;
        if (statXp) document.getElementById('rel-xp').textContent = statXp.value;
        if (statTarefas) document.getElementById('rel-tarefas').textContent = statTarefas.value;
        if (statAlunos) document.getElementById('rel-alunos').textContent = statAlunos.value;
        renderXpChart(d.xpChart);
        renderTurmasConclusao(d.classes);
      }

      if (profResult.success) {
        renderProfessores(profResult.data);
      }
    }

    document.addEventListener('DOMContentLoaded', loadRelatorios);
  </script>
  <script src="../../shared/monetto-app.js"></script>
</body>

</html>
