<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monetto - Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: linear-gradient(135deg, #0B1340 0%, #1A2A8F 100%);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
    }
    .container {
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 20px;
      padding: 40px;
      width: 420px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
    }
    h1 {
      font-family: 'Syne', sans-serif;
      font-size: 2.2rem;
      text-align: center;
      margin-bottom: 8px;
    }
    .subtitle {
      text-align: center;
      color: #FFD700;
      margin-bottom: 30px;
      font-size: 1rem;
    }
    .form-group {
      margin-bottom: 18px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.9rem;
      color: #ccc;
    }
    input {
      width: 100%;
      padding: 14px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 12px;
      color: white;
      font-size: 1rem;
    }
    input:focus {
      outline: none;
      border-color: #FFD700;
    }
    .btn {
      width: 100%;
      padding: 14px;
      background: #FFD700;
      color: #0B1340;
      border: none;
      border-radius: 12px;
      font-weight: 700;
      font-size: 1.1rem;
      cursor: pointer;
      margin-top: 10px;
    }
    .btn:hover { opacity: 0.9; }
    .toggle {
      text-align: center;
      margin-top: 20px;
      color: #aaa;
    }
    .toggle a {
      color: #FFD700;
      text-decoration: none;
    }
    .message { text-align:center; margin-top:10px; font-weight:600; }
    .message.success { color: #8bc34a; }
    .message.error { color: #ff6b6b; }
  </style>
</head>
<body>

<div class="container">
  <h1>Monetto</h1>
  <p class="subtitle">Educação Financeira Inteligente</p>

  <div id="login-form">
    <h2 style="text-align:center; margin-bottom:20px;">Entrar</h2>
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="email" placeholder="seu@email.com" required>
    </div>
    <div class="form-group">
      <label>Senha</label>
      <input type="password" id="senha" placeholder="••••••••" required>
    </div>
    <button class="btn" onclick="fazerLogin()">Entrar</button>
    <div class="toggle">Não tem conta? <a href="#" onclick="showRegister()">Criar conta</a></div>
  </div>

  <div id="register-form" style="display:none;">
    <h2 style="text-align:center; margin-bottom:20px;">Criar Conta</h2>
    <div class="form-group">
      <label>Nome Completo</label>
      <input type="text" id="nome" placeholder="Seu nome" required>
    </div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="reg_email" placeholder="seu@email.com" required>
    </div>
    <div class="form-group">
      <label>Senha</label>
      <input type="password" id="reg_senha" placeholder="Crie uma senha" required>
    </div>
    <div class="form-group">
      <label>Tipo de Usuário</label>
      <select id="id_perfil">
        <option value="1">Aluno</option>
        <option value="2">Professor</option>
        <option value="3">Escola</option>
      </select>
    </div>
    <button class="btn" onclick="fazerCadastro()">Cadastrar</button>
    <div class="toggle">Já tem conta? <a href="#" onclick="showLogin()">Fazer login</a></div>
  </div>

  <div id="msg" class="message"></div>
</div>

<script>
async function fazerLogin() {
  const email = document.getElementById('email').value.trim();
  const senha = document.getElementById('senha').value.trim();
  const msgEl = document.getElementById('msg');

  if (!email || !senha) {
    msgEl.textContent = "Preencha email e senha";
    msgEl.className = 'message error';
    return;
  }

  try {
    const result = await window.api.login({ email, senha });
    
    msgEl.textContent = result.message;
    msgEl.className = 'message ' + (result.success ? 'success' : 'error');

    if (result.success && result.redirect) {
      setTimeout(() => {
        window.location.href = result.redirect;
      }, 1500);
    }
  } catch (err) {
    console.error(err);
    msgEl.textContent = "Erro de comunicação com o servidor.";
    msgEl.className = 'message error';
  }
}

async function fazerCadastro() {
  const dados = {
    nome: document.getElementById('nome').value.trim(),
    email: document.getElementById('reg_email').value.trim(),
    senha: document.getElementById('reg_senha').value,
    id_perfil: parseInt(document.getElementById('id_perfil').value)
  };

  const msgElement = document.getElementById('msg');

  try {
    const result = await window.api.registerUser(dados);
    msgElement.textContent = result.message;
    msgElement.className = 'message ' + (result.success ? 'success' : 'error');

    if (result.success) {
      setTimeout(() => showLogin(), 1800);
    }
  } catch (err) {
    console.error(err);
    msgElement.textContent = "Erro de comunicação com o servidor.";
    msgElement.className = 'message error';
  }
}

function showRegister() {
  document.getElementById('login-form').style.display = 'none';
  document.getElementById('register-form').style.display = 'block';
  document.getElementById('msg').textContent = '';
}

function showLogin() {
  document.getElementById('login-form').style.display = 'block';
  document.getElementById('register-form').style.display = 'none';
  document.getElementById('msg').textContent = '';
}
</script>
</body>
</html>
