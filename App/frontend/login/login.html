<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Monetto - Login</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="login.css" />
  <link rel="icon" type="image/x-icon" href="../Assets/Monetto Logo.ico">


  <link rel="stylesheet" href="../shared/redesign.css" />
  <style>
    body.login-page {
      min-height: 100vh;
      overflow: auto;
      background: var(--bg) !important;
    }
    body.login-page .page {
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
    }
    body.login-page .page .left {
      flex: none;
      width: 100%;
      min-height: 0;
      padding: 0;
      background: transparent !important;
    }
    body.login-page .form-box {
      width: min(100%, 440px);
      max-width: 440px;
      padding: 36px;
      border-radius: 16px !important;
    }
    body.login-page .form-box .logo {
      color: var(--text) !important;
      font-size: 1.6rem;
    }
    body.login-page .form-box .subtitle {
      color: var(--muted) !important;
      margin-bottom: 30px;
    }
    body.login-page .form-box h2 {
      margin: 0 0 6px;
      color: var(--text) !important;
      font-family: inherit;
      font-size: 1.55rem;
      font-weight: 700;
      text-decoration: none !important;
      text-decoration-line: none !important;
      -webkit-text-fill-color: var(--text) !important;
    }
    body.login-page .form-box .desc {
      color: var(--muted) !important;
      margin-bottom: 24px;
    }
    body.login-page .form-box .form-group label {
      color: var(--text) !important;
    }
    body.login-page .form-box .input-wrap {
      padding: 0 12px;
      background: var(--surface-2) !important;
      border: 1px solid var(--border) !important;
      border-radius: 9px;
    }
    body.login-page .form-box .input-wrap:focus-within {
      border-color: var(--brand) !important;
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 16%, transparent);
    }
    body.login-page .form-box .input-wrap input {
      min-height: 46px;
      padding: 11px 0;
      background: transparent !important;
      color: var(--text) !important;
      border: 0 !important;
      border-radius: 0;
      box-shadow: none !important;
      outline: 0;
    }
    body.login-page .form-box .input-wrap input::placeholder {
      color: var(--muted) !important;
    }
    body.login-page .form-box .btn {
      min-height: 46px;
      margin-top: 8px;
      border-radius: 9px !important;
    }
    body.login-page .login-note {
      margin: 16px 0 0;
      color: var(--muted) !important;
      font-size: .82rem;
      line-height: 1.5;
      text-align: center;
    }
    body.login-page .message { line-height: 1.45; }
    @media (max-width: 480px) {
      body.login-page .page { padding: 18px 14px; }
      body.login-page .form-box { padding: 28px 22px; }
    }
  </style>
</head>

<body class="login-page">

  <script>
    // Electron adds this only on a fresh app launch. Clear persisted auth while
    // keeping the session available as the user navigates during this run.
    if (new URLSearchParams(location.search).get("fresh") === "1") {
      localStorage.removeItem("session");
      history.replaceState(null, "", location.pathname);
    }
  </script>

  <div class="page">
    <!-- LEFT -->

    <div class="left">
      <div class="form-box">
        <div class="logo">
          <img src="../Assets/Monetto Logo.png" alt="Monetto Logo" style="height: 50px; border-radius: 15%;" />
          Monetto
        </div>

        <p class="subtitle">Educação Financeira Inteligente</p>

        <form id="login-form" onsubmit="event.preventDefault(); fazerLogin();">
          <h2>Entrar</h2>
          <p class="desc">Acesse sua conta e continue evoluindo</p>

          <div class="form-group">
            <label for="email">Email</label>

            <div class="input-wrap">
              <input type="email" id="email" placeholder="seu@email.com" autocomplete="username" required autofocus />
            </div>
          </div>

          <div class="form-group">
            <label for="senha">Senha</label>

            <div class="input-wrap">
              <input type="password" id="senha" placeholder="••••••••" autocomplete="current-password" required />
            </div>
          </div>

          <button class="btn" type="submit">
            Entrar e jogar
          </button>
          <p class="login-note">Seu acesso é fornecido pela escola. Se precisar de uma conta, fale com o administrador.</p>
        </form>

        <div id="msg" class="message" role="status" aria-live="polite"></div>
      </div>
    </div>

    <!-- RIGHT -->
  </div>

  <script>
    async function fazerLogin() {
      const email = document.getElementById("email").value.trim();
      const senha = document.getElementById("senha").value.trim();
      const msgEl = document.getElementById("msg");

      if (!email || !senha) {
        msgEl.textContent = "Preencha email e senha";
        msgEl.className = "message error";
        return;
      }

      try {
        const result = await window.api.login({ email, senha });

        msgEl.textContent = result.message;
        msgEl.className = "message " + (result.success ? "success" : "error");

        if (result.success) {
          localStorage.setItem("session", JSON.stringify(result.user));

          if (result.redirect) {
            setTimeout(() => {
              window.location.href = result.redirect;
            }, 1200);
          }
        }
      } catch (err) {
        console.error(err);
        msgEl.textContent = "Erro de comunicação com o servidor.";
        msgEl.className = "message error";
      }
    }

    // Resume the last account only for the lifetime of the current app run.
    (function resumeSession() {
      let session;
      try { session = JSON.parse(localStorage.getItem("session") || "null"); }
      catch (_) { session = null; }
      if (!session || !session.id_perfil) return;
      const destinations = {
        1: "../student/dashboard-aluno/dashboard-aluno.html",
        2: "../teacher/dashboard-professor/dashboard-professor.html",
        3: "../admin_school/dashboard-admin-escolar/dashboard-admin-escolar.html",
        4: "../admin_general/dashboard-admin-geral/dashboard-admin-geral.html",
      };
      const destination = destinations[session.id_perfil];
      if (destination) location.replace(destination);
      else localStorage.removeItem("session");
    })();

  </script>
  <script src="script.js"></script>
  <script src="../shared/monetto-shell.js"></script>
</body>

</html>
